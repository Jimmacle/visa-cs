name: Release

# Pushing a tag vX.Y.Z that matches <Version> in src/Directory.Build.props builds, tests and packs the libraries,
# publishes the packages to this repository's GitHub Packages NuGet feed and creates a GitHub release with them.
# Nothing is published to nuget.org.
#
# Only people with write access can push tags, and the job that runs the repository's code has a read-only token;
# the job with write access only uploads the finished packages.

on:
  push:
    tags: ['v*']

permissions: {}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check that the tag matches the version
        run: |
          version=$(dotnet msbuild src/VisaCs/VisaCs.csproj -getProperty:Version)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the project version $version."
            exit 1
          fi

      - name: Build
        run: dotnet build VisaCs.slnx -c Release

      - name: Test
        run: dotnet test tests/VisaCs.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack VisaCs.slnx -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts

      - name: Publish to GitHub Packages
        env:
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" --source "https://nuget.pkg.github.com/$OWNER/index.json" \
            --api-key "$NUGET_TOKEN" --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" artifacts/*.nupkg --repo "$REPOSITORY" \
            --title "VisaCs ${GITHUB_REF_NAME#v}" --generate-notes $prerelease
